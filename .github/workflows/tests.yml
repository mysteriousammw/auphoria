name: Tests

# Runs only after the repository is published (nothing runs it locally until
# it is pushed to GitHub). Covers Python 3.10, 3.11, 3.12 on Linux, macOS and
# Windows to honour AUPHORIA's cross-platform requirement.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI smoke test
        run: |
          auphoria --version
          auphoria doctor
      - name: Run tests
        run: pytest -q