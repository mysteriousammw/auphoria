name: Lint

# Runs only after the repository is published (nothing runs it locally until
# it is pushed to GitHub).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Lint (ruff check)
        run: ruff check .