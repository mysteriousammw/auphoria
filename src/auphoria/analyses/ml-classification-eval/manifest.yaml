id: ml-classification-eval
name: ML Classification Model Evaluation
maturity: experimental
levels: [advanced]
disciplines:
  - computer-science
  - bioinformatics
  - economics
  - health
  - social-sciences
description: >
  Evaluates a cross-validated machine-learning classification baseline
  (logistic regression) against one categorical label column, using every
  other numeric column as automatic features. Reporting is honest about
  train/test separation: a held-out stratified test set scores accuracy,
  precision, recall, F1 and ROC-AUC, and stratified cross-validation adds
  an estimate of how stable the accuracy is across folds. This is a
  baseline, not a tuned model.
inputs:
  - name: label
    kind: categorical-column
    required: true
    description: The target class you want to predict (e.g. diagnosis, outcome).
    constraints: must be a categorical column with exactly two classes (binary classification)
parameters:
  - name: test_size
    type: number
    default: 0.3
    min: 0.1
    max: 0.5
    description: Fraction of the data held out as the test set for honest evaluation.
  - name: cv_folds
    type: integer
    default: 5
    min: 2
    max: 10
    description: Number of folds for cross-validation.
  - name: random_state
    type: integer
    default: 1
    description: Seed for reproducible train/test split and model fitting.
outputs:
  - confusion matrix table (predicted vs actual class counts)
  - classification metrics table (precision, recall, F1, support per class, accuracy)
  - cross-validation scores table (per-fold accuracy, mean and SD)
  - ROC curve figure (with the test-set ROC-AUC)
  - cross-validation scores figure
  - methods.txt paragraph
  - report.html
assumptions:
  - The label column has exactly two classes (binary classification; ROC-AUC
    needs two classes). A single-class column is refused.
  - At least two numeric feature columns are available (all other numeric
    columns are used automatically as features).
  - A minimum of 20 rows is required to run; results from fewer than 30 rows,
    a class with fewer than 5 rows, or strongly imbalanced classes are flagged
    for expert review.
  - Class balance is reported so you can see whether accuracy is a meaningful
    metric for your data.
  - Missing values are counted and rows with missing values are dropped with a
    warning; values are never imputed (imputation would leak information).
assumptions_minimum_sample_size: >
  At least 20 complete rows after dropping rows with missing values. Results
  should be treated as preliminary below 30 rows and, given the number of
  features is not penalised, should only be trusted as a baseline comparison,
  not as a tuned production model.
limitations:
  - A good test-set ROC-AUC or accuracy does not prove the model generalises
    to new settings; it only reports how it performed on the single held-out
    sample. Cross-validation gives only a rough idea of stability.
  - Leakage (using test information when training, e.g. scaling before the
    split or imputing on the full data) invalidates every number here; this
    run keeps train and test separate.
  - Accuracy is misleading on imbalanced classes — read precision, recall and
    ROC-AUC together.
  - This is a plain, untuned logistic-regression baseline, not a tuned model;
    it is for establishing a lower bound, not for final deployment.
  - Missing values are dropped, not imputed, so rows shrink.
pack:
  - econ-eng
requires:
  - sklearn
reference: >-
    Synthetic features; cross-checked vs scikit-learn (LogisticRegression, same split/seed)
test_data:
  - "Deterministic synthetic data in tests/test_ml_classification_eval.py,
     with accuracy, ROC-AUC and the confusion matrix compared against
     scikit-learn's reference implementation (same split, same seed;
     train_test_split, LogisticRegression, roc_auc_score, confusion_matrix)."