id: spearman-correlation
name: Spearman Rank Correlation
maturity: experimental
levels: [beginner, intermediate]
disciplines:
  - agriculture
  - animal-science
  - life-sciences
  - health
  - psychology
  - social-sciences
  - education
  - economics
  - engineering
  - environmental-science
  - computer-science
description: >
  Measures whether two variables tend to increase or decrease together when
  their values are converted to ranks. Reports Spearman's rho, a p-value,
  the sample size used, and a plain-English interpretation of the direction
  and strength of the monotonic relationship.
inputs:
  - name: x
    kind: numeric-column
    required: true
    description: The first numeric column (e.g. study_rank).
    constraints: must be a numeric column
  - name: y
    kind: numeric-column
    required: true
    description: The second numeric column (e.g. exam_score).
    constraints: must be a numeric column
parameters:
  - name: alpha
    type: number
    default: 0.05
    min: 0.001
    max: 0.5
    description: Significance level used to judge the p-value.
  - name: tail
    type: choice
    default: two-sided
    choices: [two-sided, greater, less]
    description: Direction of the test for the correlation.
outputs:
  - Spearman correlation table (rho, p-value, n, direction, strength)
  - scatter figure of the ranks with a rho annotation
  - methods.txt paragraph
  - report.html
assumptions:
  - Both columns are numeric and measured on the same set of observations.
  - The relationship of interest is monotonic (steadily up or down, not
    necessarily a straight line); a U-shaped relationship can give a
    misleading rho near zero even though a strong pattern exists.
  - Spearman works on ranks, so it does not need a normality assumption,
    but heavy ties (many equal values) distort rho, and rho is reported
    with a caution note when ties are common.
limitations:
  - Correlation does not imply causation.
  - rho close to zero does not mean 'no relationship' — only no *monotonic*
    relationship.
  - rho tells you whether things move together when ranked, not how big the
    moves are; ranks hide effect sizes.
  - Missing values in the two columns are excluded pairwise (and reported),
    never imputed.
reference: >-
    Hand-computed rho = 0.5 (rank-d^2 sum = 10) for x=[1..5], y=[3,1,4,2,5]; cross-checked vs scipy.stats.spearmanr
test_data:
  - "Synthetic data in tests/test_spearman.py: a perfect monotonic line
     (rho = 1 and rho = -1) and a hand-computed example (rho = 0.5) compared
     against SciPy's reference implementation."
