id: experimental-design
name: Experimental Design ANOVA (CRD, RCBD, Latin Square, Factorial)
maturity: experimental
levels:
  - intermediate
  - advanced
disciplines:
  - agriculture
  - animal-science
  - life-sciences
  - environmental-science
  - biology
description: >-
  Analyses a designed experiment with one of four classic layouts chosen via
  the 'design' parameter: completely randomized (CRD), randomized complete
  block (RCBD), Latin square, or a two-factor factorial. Reports the
  analysis-of-variance table for that design (blocking factors removed from
  the error term), treatment means, Tukey/LSD mean separation, and the
  assumptions checked, so students see the design's structure in the output.
inputs:
  - name: outcome
    kind: numeric-column
    required: true
    description: The numeric response (e.g. yield, growth, score).
    constraints: must be a numeric column
  - name: treatment
    kind: categorical-column
    required: true
    description: The treatment/factor of interest (e.g. fertiliser dose, variety).
    constraints: must have two or more categories
  - name: block
    kind: categorical-column
    required: false
    description: Blocking factor (required for RCBD; optional elsewhere).
    constraints: categorical column, one level per block
  - name: row
    kind: categorical-column
    required: false
    description: Row block (required for Latin square).
    constraints: categorical column
  - name: col
    kind: categorical-column
    required: false
    description: Column block (required for Latin square).
    constraints: categorical column
  - name: factor_b
    kind: categorical-column
    required: false
    description: Second factor (required for factorial design).
    constraints: categorical column
parameters:
  - name: design
    type: text
    default: crd
    choices: [crd, rcbd, latin-square, factorial]
    description: The experimental layout to analyse.
  - name: alpha
    type: number
    default: 0.05
    min: 0.001
    max: 0.5
    description: Significance level for the F tests and mean separation.
  - name: separation
    type: text
    default: tukey
    choices: [tukey, lsd]
    description: Mean-separation method (Tukey HSD or Fisher LSD).
outputs:
  - design structure table (layout, units, treatments, blocks)
  - ANOVA table (source, SS, df, MS, F, p for every factor in the design)
  - treatment means table with mean separation letters
  - assumption checks (Shapiro-Wilk residuals, Levene's test)
  - effects plot (treatment means with error bars)
  - methods.txt paragraph
  - report.html
assumptions:
  - The design must be balanced (equal observations per treatment combination); unbalanced layouts are refused with a hint to use anova-oneway or regression instead.
  - The outcome is numeric and roughly normally distributed (checked on residuals with Shapiro-Wilk; reported as WARN, never a hard refusal).
  - Variances are homogeneous across treatments (checked with Levene's test; reported as WARN).
  - For CRD, groups are independent; for RCBD, one observation per treatment per block; for Latin square, one observation per row/col/treatment cell; for factorial, all treatment combinations present equally often.
  - Missing values are counted and excluded with a warning, never imputed.
limitations:
  - A significant F only says at least one treatment differs; use the mean-separation table to see which treatments differ.
  - Results are associations, not causation; randomisation and replication happened at design time, not inside this tool.
  - Unbalanced and incomplete designs (missing cells, different block sizes) are out of scope — use regression-multiple with dummy variables for those.
  - Split-plot and other partially nested layouts are not covered by this version.
reference: >-
  Standard textbook CRD/RCBD examples: three treatments (means 4/10/16),
  SS_between = 288, SS_within = 24, F = 54, p < 0.001 — the same fixture as
  anova-oneway; RCBD fixture with block SS subtracted from the error term.
test_data:
  - "Deterministic synthetic data in tests/test_experimental_design.py:
    4 design fixtures (CRD, RCBD, Latin square, 2x2 factorial) with
    hand-computed SS/F/p, cross-checked against scipy (f_oneway, levene,
    shapiro, studentized_range)."
