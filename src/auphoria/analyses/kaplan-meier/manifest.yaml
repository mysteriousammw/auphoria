id: kaplan-meier
name: Kaplan-Meier survival analysis
maturity: experimental
levels: [advanced]
disciplines:
  - health
  - life-sciences
  - engineering
  - economics
  - social-sciences
description: >-
  Estimates survival curves over time for censored time-to-event data (e.g.
  time to relapse, failure of a component, time to dropout), one curve per
  group, using the Kaplan-Meier product-limit method (statsmodels
  SurvfuncRight), reports median survival, and compares the groups with a
  log-rank test so you can see whether their survival curves differ.
inputs:
  - name: time
    kind: numeric-column
    required: true
    description: Time-to-event column (e.g. time since study entry, months, days).
    constraints: non-negative numeric times
  - name: event
    kind: numeric-column
    required: true
    description: "Event indicator: 0 = censored, 1 = event occurred."
    constraints: must contain only 0 and 1
  - name: group
    kind: categorical-column
    required: true
    description: Grouping column with two or more categories to compare.
    constraints: must have two or more categories, each with at least one event
parameters:
  - name: alpha
    type: number
    default: 0.05
    min: 0.001
    max: 0.5
    description: Significance level (probability of a false positive you accept).
outputs:
  - survival table per group (time, at-risk n, events, survival probability)
  - median survival per group
  - log-rank test chi-squared, degrees of freedom and p-value
  - number-at-risk table and survival-curve figure for all groups
  - methods.txt paragraph
  - report.html
assumptions:
  - "Right-censoring is non-informative: subjects who drop out are no more and
    no less likely to have the event than those who remain under observation."
  - Censoring is independent of survival time.
  - The groups are comparable and their curves are estimated independently.
  - "Minimum sample size: at least 20 complete observations overall and at
    least 5 observed events per group for the curves and log-rank test to be
    meaningful. With fewer, the analysis runs but flags an expert review."
limitations:
  - "Survival curves describe this sample only; they are not a cure rate or a
    true population risk, and informative censoring biases them heavily."
  - "The log-rank test compares whole curves; it does not quantify how much
    groups differ or give a hazard ratio, and it is not causation."
  - "Heavy censoring (>70%) or very few events make the right tail and the
    median unreliable."
  - Missing values in the chosen columns are excluded (and reported), not
    imputed.
pack:
  - health
  - life-science
requires:
  - statsmodels
reference: >-
    Hand-computed survival curve for times [2,3,5,6], events [1,1,0,1]; cross-checked vs statsmodels SurvfuncRight + hand log-rank
test_data:
  - "Deterministic synthetic data in tests/test_kaplan_meier.py, with
     hand-computed survival probabilities (e.g. S = [0.75, 0.5, 0] for times
     [2, 3, 5, 6] with events [1, 1, 0, 1]) and a hand-computed log-rank
     chi-squared, compared against statsmodels SurvfuncRight as reference."