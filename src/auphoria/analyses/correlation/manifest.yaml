id: correlation
name: Pearson Correlation
maturity: experimental
levels: [beginner, intermediate]
disciplines:
  - agriculture
  - animal-science
  - life-sciences
  - health
  - psychology
  - social-sciences
  - education
  - economics
  - engineering
  - environmental-science
  - computer-science
description: >
  Measures the strength and direction of a straight-line (linear) relationship
  between two numeric columns, and reports the correlation coefficient r, a
  p-value, the sample size used, and a plain-English interpretation.
inputs:
  - name: x
    kind: numeric-column
    required: true
    description: The first numeric column (e.g. hours_studied).
    constraints: must be a numeric column
  - name: y
    kind: numeric-column
    required: true
    description: The second numeric column (e.g. exam_score).
    constraints: must be a numeric column
parameters:
  - name: tail
    type: choice
    default: two-sided
    choices: [two-sided, greater, less]
    description: Direction of the test for the correlation.
outputs:
  - correlation result table (r, p-value, n, interpretation)
  - scatter figure with a labelled trend line
  - methods.txt paragraph
  - report.html
assumptions:
  - Both columns are numeric and measured on the same set of observations.
  - The relationship of interest is roughly straight-line (linear); a
    strongly curved relationship can give a misleading r near zero.
  - Pearson r is most meaningful when the two variables are roughly bivariate
    normal; rank methods are more robust to outliers (planned analysis).
limitations:
  - Correlation does not imply causation.
  - r close to zero does not mean "no relationship" — only no *linear*
    relationship.
  - One very unusual (outlier) value can change r a lot.
  - Missing values in the two columns are excluded pairwise (and reported),
    never imputed.
reference: >-
    Hand-computed Pearson r on x=[1..5]; cross-checked vs scipy.stats.pearsonr
test_data:
  - "Synthetic data in tests/test_correlation.py: a perfect linear line (r = 1)
     and a hand-computed example (r = 0.967) compared against SciPy's
     reference implementation."