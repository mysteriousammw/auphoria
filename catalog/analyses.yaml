- id: anova-repeated
  name: Repeated-Measures ANOVA
  plain_english_question: Do mean values change across several time points measured
    on the same subjects?
  levels:
  - MPhil
  - PhD
  disciplines:
  - psychology
  - social-sciences
  - education
  - medicine
  - public-health
  - agriculture
  design: repeated measures (within-subject, 3+ time points)
  data_requirements: One outcome measured at 3+ time points per subject (or a subject
    id + time + value).
  assumptions_to_check: Sphericity; normally distributed differences; no carry-over/order
    effects.
  alternatives_when_assumptions_fail: Friedman test (non-parametric); mixed-effects/multilevel
    model with random intercept for subject.
  python_library_and_function: pingouin.rm_anova; statsmodels AnovaRM
  outputs: F, df, p, sphericity check, time-point means, interaction plot.
  common_mistakes: Treating repeated measurements as independent; ignoring sphericity;
    using repeated ANOVA when many levels or missing data (use mixed model).
  priority: P2
  pack:
  - social
  - health
  - life-science
  sources:
  - https://psychology.osu.edu/courses/psych-3321
  - https://www.ruraluniv.ac.in/includes/academics/faculties/dept/11/pdf/Mphil_edn_201819.pdf
- id: ancova
  name: Analysis of Covariance (ANCOVA)
  plain_english_question: Do groups differ on a numeric outcome after controlling
    for a continuous covariate?
  levels:
  - MPhil
  - PhD
  disciplines:
  - psychology
  - education
  - social-sciences
  - agriculture
  - medicine
  design: independent groups + covariate
  data_requirements: Numeric outcome + group column + one or more numeric covariates.
  assumptions_to_check: Linearity between covariate and outcome; homogeneity of regression
    slopes across groups; normality; equal variances.
  alternatives_when_assumptions_fail: Mixed/multilevel model; robust methods; transform.
  python_library_and_function: pingouin.ancova; statsmodels OLS with group + covariate
  outputs: Adjusted means, F for group effect, covariate effect, p, effect size.
  common_mistakes: Ignoring the homogeneity-of-slopes assumption; treating a measured
    (non-randomised) covariate as if causal; double-counting the covariate.
  priority: P2
  pack:
  - social
  - agri-animal
  - health
  sources:
  - https://www.ruraluniv.ac.in/includes/academics/faculties/dept/11/pdf/Mphil_edn_201819.pdf
- id: friedman
  name: Friedman Test (Repeated Measures, Non-parametric)
  plain_english_question: Do at least one of several related measurements differ,
    when data are not normal?
  levels:
  - MPhil
  - PhD
  disciplines:
  - psychology
  - social-sciences
  - medicine
  - education
  design: repeated measures (non-parametric)
  data_requirements: Three or more related (within-subject) columns.
  assumptions_to_check: Related samples; sufficient blocks.
  alternatives_when_assumptions_fail: Repeated-measures ANOVA when normal; otherwise
    post-hoc Wilcoxon with correction.
  python_library_and_function: scipy.stats.friedmanchisquare; pingouin.friedman
  outputs: Chi-square statistic, df, p, medians per condition.
  common_mistakes: Using it on independent groups; not following up with corrected
    pairwise comparisons.
  priority: P2
  pack:
  - social
  - health
  sources:
  - https://www.pearson.com/en-us/subject-catalog/p/biostatistics-for-the-biological-and-health-sciences/P200000007576
- id: mixed-effects
  name: Linear Mixed-Effects Model (Multilevel)
  plain_english_question: How do predictors relate to a numeric outcome when observations
    are grouped, nested, or repeated (clustered data)?
  levels:
  - PhD
  disciplines:
  - psychology
  - education
  - agriculture
  - medicine
  - biology
  - environmental-science
  design: clustered / nested / repeated (random effects)
  data_requirements: Numeric outcome + predictors + a grouping/id column (subject,
    classroom, plot, site).
  assumptions_to_check: Normality of residuals and random effects; appropriate random
    structure; no severe imbalance.
  alternatives_when_assumptions_fail: Generalised linear mixed model for non-normal
    outcomes; simpler cluster-robust SE if only adjusting inference.
  python_library_and_function: statsmodels MixedLM; pingouin for mixed ANOVA helpers
  outputs: Fixed-effect coefficients with CI and p, random-effect variance, intraclass
    correlation.
  common_mistakes: Ignoring clustering (pseudo-replication); over-fitting random effects
    on tiny data; interpreting level-1 slopes as level-2 effects.
  priority: P2
  pack:
  - social
  - agri-animal
  - life-science
  - health
  sources:
  - https://link.springer.com/chapter/10.1007/978-0-387-87458-6_13
- id: factor-analysis
  name: Exploratory Factor Analysis (EFA)
  plain_english_question: Do the items I measured group into a few underlying latent
    dimensions?
  levels:
  - MPhil
  - PhD
  disciplines:
  - psychology
  - social-sciences
  - education
  - public-health
  design: psychometrics / latent structure
  data_requirements: Several correlated numeric item columns; adequate sample (rule
    of thumb ~5-10 per item, 100+).
  assumptions_to_check: Correlations sufficient (KMO, Bartlett's); correct number
    of factors; rotation choice; adequacy of sample size.
  alternatives_when_assumptions_fail: PCA if purely data-reduction; CFA if you already
    hypothesise the structure; consider sample-size limits.
  python_library_and_function: factor_analyzer (FactorAnalyzer); sklearn PCA as approximation
  outputs: KMO/Bartlett, factor loadings matrix, eigenvalues/scree, variance explained,
    suggested factor labels.
  common_mistakes: Too-small sample; interpreting loadings without rotation guidance;
    naming factors beyond the data; conflating EFA with PCA.
  priority: P2
  pack:
  - social
  - health
  sources:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC10353679/
  - https://tpmap.org/submission/index.php/tpm/article/download/304/187/651
- id: diagnostic-test
  name: Diagnostic Test Performance (Sensitivity/Specificity/ROC)
  plain_english_question: How well does a test or model separate those with vs without
    a condition?
  levels:
  - PhD
  - MPhil
  disciplines:
  - medicine
  - public-health
  - bioinformatics
  design: diagnostic accuracy / classification threshold
  data_requirements: Test result + true reference standard (binary), or scores + labels
    for ROC.
  assumptions_to_check: Reference standard is valid; independent sample; threshold
    choice justified; prevalence reported.
  alternatives_when_assumptions_fail: Report AUC plus operating-characteristic curve;
    over-sampling caution for ROC.
  python_library_and_function: 'scikit-learn: roc_auc_score, confusion_matrix; statsmodels'
  outputs: Sensitivity, specificity, PPV/NPV, confusion matrix, ROC curve with AUC,
    optimised threshold.
  common_mistakes: Reporting sensitivity without specificity & prevalence; using accuracy
    on imbalanced classes; cherry-picking the threshold.
  priority: P2
  pack:
  - health
  - bioinformatics
  sources:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC5286748/
  - https://www.fda.gov/files/medical%20devices/published/Guidance-for-Industry-and-FDA-Staff---Statistical-Guidance-on-Reporting-Results-from-Studies-Evaluating-Diagnostic-Tests-(PDF-Version).pdf
- id: bland-altman
  name: Bland-Altman Agreement
  plain_english_question: Are two measurement methods close enough to be used interchangeably
    on the same subjects?
  levels:
  - PhD
  - MPhil
  disciplines:
  - medicine
  - engineering
  - biology
  - agriculture
  design: method comparison (paired, continuous)
  data_requirements: Two paired numeric measurements of the same quantity on the same
    subjects.
  assumptions_to_check: Differences roughly normally distributed; bias and limits
    not proportional to magnitude (check the plot).
  alternatives_when_assumptions_fail: Agreement analysis on log scale when variability
    scales with magnitude; report ICC too.
  python_library_and_function: pingouin.bland_altman; statsmodels
  outputs: Bias, 95% limits of agreement, Bland-Altman plot, decision on interchangeability.
  common_mistakes: Using correlation to claim agreement (correlation ignores bias);
    ignoring censoring of the limits; small samples.
  priority: P2
  pack:
  - health
  - life-science
  sources:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC5829700/
- id: panel-regression
  name: Panel / Longitudinal Fixed-Effects Regression
  plain_english_question: What predicts an outcome using repeated observations per
    unit, adjusting for stable unobserved differences (panel data)?
  levels:
  - PhD
  disciplines:
  - economics
  - business
  - social-sciences
  design: panel / longitudinal (within-unit)
  data_requirements: Outcome + predictors + unit id + time; multiple observations
    per unit.
  assumptions_to_check: Choose FE vs RE (Hausman); within-unit variation exists; no
    severe serial dependence.
  alternatives_when_assumptions_fail: Random-effects/mixed model if appropriate; first-differences;
    robust clustered SE.
  python_library_and_function: statsmodels PanelOLS / linearmodels; MixedLM for RE
  outputs: Coefficients, within-R2, Hausman guidance, cluster-robust SE.
  common_mistakes: Ignoring within-unit correlation; using RE when FE needed (bias);
    small T large N pitfalls.
  priority: P3
  pack:
  - econ-eng
  - social
  sources:
  - https://phdeconomics.unisi.it/wp-content/uploads/sites/127/2024/12/Panel-Data-Econometrics_40.pdf
- id: time-series
  name: Time-Series Decomposition & Trend
  plain_english_question: Is there a trend/seasonality in a variable measured over
    time, and can I forecast it simply?
  levels:
  - PhD
  - MPhil
  disciplines:
  - economics
  - environmental-science
  - engineering
  - public-health
  design: time (longitudinal regular)
  data_requirements: A date/time column + a numeric value; regular time interval.
  assumptions_to_check: Stationarity for forecasting; autocorrelation structure; adequate
    length; no leakage across train/test.
  alternatives_when_assumptions_fail: ARIMA/ETS for forecasting; differencing; STL
    decomposition for trend/season.
  python_library_and_function: 'statsmodels.tsa: seasonal_decompose, acf/pacf; (ARIMA
    later)'
  outputs: Trend/season plot, decomposition, autocorrelation plot, simple forecast
    with CI.
  common_mistakes: Forgetting seasonality; using regression on time ignoring autocorrelation;
    forecasting beyond supported horizon.
  priority: P3
  pack:
  - econ-eng
  - life-science
  sources:
  - https://www.ntu.edu.sg/media/docs/librariesprovider117/admission/courses/he3003-econometrics-ii.pdf?sfvrsn=1f08db06_2
- id: differential-expression
  name: Differential Expression / Count Comparison (RNA-seq style)
  plain_english_question: Are counts (e.g. gene/transcript reads) different between
    conditions, accounting for over-dispersion?
  levels:
  - PhD
  - MPhil
  disciplines:
  - bioinformatics
  design: negative-binomial / generalized linear (groups)
  data_requirements: Count matrix (samples x features) + condition labels; needs normalisation/offsets.
  assumptions_to_check: Over-dispersion; library-size normalisation; multiple-testing
    correction (FDR/BH).
  alternatives_when_assumptions_fail: Limma-voom style; log-transform with shrinkage;
    non-parametric rank-based for small n.
  python_library_and_function: pydeseq2 / statsmodels GLM(negative binomial); multiple
    testing via statsmodels.multipletests
  outputs: Per-feature log-fold-change, FDR-adjusted p, mean-dispersion plot, top-features
    table.
  common_mistakes: Using a plain t-test on counts (ignoring dispersion/library size);
    no FDR correction; tiny sample sizes with no pooling.
  priority: P3
  pack:
  - bioinformatics
  sources:
  - https://epublications.marquette.edu/cgi/viewcontent.cgi?article=1587&context=theses_open
  - https://bch709.plantgenomicslab.org/DEG2022/index.html
- id: sem
  name: Structural Equation Modelling (CFA/Path)
  plain_english_question: Does my hypothesised network of relationships between latent
    constructs fit the data?
  levels:
  - PhD
  disciplines:
  - psychology
  - social-sciences
  - education
  design: latent-variable / path (confirmatory)
  data_requirements: Multiple indicator columns per latent construct; large samples;
    a hypothesised model.
  assumptions_to_check: Multivariate normality (or use robust); model identification;
    adequate sample; local fit indices.
  alternatives_when_assumptions_fail: EFA first if structure uncertain; PLS-SEM for
    small/predictive; treat as exploratory.
  python_library_and_function: semopy (SEM); fit indices CFI/TLI/RMSEA/SRMR
  outputs: Fit indices (CFI, TLI, RMSEA, SRMR), path loadings, modification indices.
  common_mistakes: Theory-free model; very large samples making RMSEA 'significant';
    ignoring local fit.
  priority: P3
  pack:
  - social
  sources:
  - https://degrees.asu.edu/masters-phd/major/ASU00/LAPSYQUPHD/psychology-quantitative-research-methods-phd
  - https://morgridge.du.edu/academics-advising/programs-gr/phd-research-methods-and-statistics
- id: experimental-design
  name: Experimental Design ANOVA (CRD/RCBD/Latin/Factorial)
  plain_english_question: How do treatments compare under my experimental design (blocks,
    Latin square, factorial structure)?
  levels:
  - MPhil
  - PhD
  disciplines:
  - agriculture
  - animal-science
  - biology
  - environmental-science
  design: between-subjects replicated (balanced)
  data_requirements: Balanced outcome + treatment (+ block/row/col/factor_b) columns;
    one observation per cell for blocked layouts.
  assumptions_to_check: Normality of residuals; homogeneity of variance; balance;
    one obs per block-treatment cell (RCBD/Latin).
  alternatives_when_assumptions_fail: anova-oneway or kruskal-wallis for unbalanced
    independent groups; regression-multiple with dummies for confounded designs.
  python_library_and_function: scipy stats (f_oneway, studentized_range, levene, shapiro)
  outputs: Design-specific ANOVA table, treatment means + Tukey/LSD separation, checks.
  common_mistakes: Analysing a blocked design as CRD (inflates error); unbalanced
    data; ignoring the block in the error term.
  priority: P1
  pack:
  - agri-animal
  sources:
  - https://www.itl.nist.gov/div898/handbook/pri/section3/pri323.htm
