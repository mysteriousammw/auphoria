- id: clustering-kmeans
  name: K-Means Clustering
  plain_english_question: Can these observations be grouped into clusters so that
    members of a cluster are similar?
  levels:
  - MPhil
  - PhD
  disciplines:
  - computer-science
  - bioinformatics
  - business
  - agriculture
  - environmental-science
  design: unsupervised learning
  data_requirements: Numeric columns (scaled); you must expect/seek clusters.
  assumptions_to_check: Variables scaled to equal units; choose k carefully (elbow/silhouette);
    clusters meaningful, not an artefact.
  alternatives_when_assumptions_fail: Hierarchical clustering or DBSCAN for non-spherical/density
    clusters; k-medoids for outliers.
  python_library_and_function: sklearn.cluster.KMeans; scipy.cluster.hierarchy
  outputs: Cluster assignments, cluster centres, silhouette/elbow plots, cluster profiles.
  common_mistakes: Clustering raw unscaled variables; choosing k by eye only; forcing
    spherical clusters on non-spherical data; not standardising.
  priority: P2
  pack:
  - ml
  - bioinformatics
  - econ-eng
  sources:
  - https://cran.r-project.org/web/views/Cluster.html
