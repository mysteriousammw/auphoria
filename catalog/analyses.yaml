- id: hardy-weinberg
  name: Hardy-Weinberg Equilibrium Test
  plain_english_question: Are my genotype counts at this locus consistent with random
    mating (Hardy-Weinberg)?
  levels:
  - BS
  - MPhil
  disciplines:
  - biology
  - biotechnology
  - agriculture
  - animal-science
  - public-health
  design: goodness-of-fit (biallelic)
  data_requirements: Per-marker counts of AA/Aa/aa genotypes.
  assumptions_to_check: Expected cell counts >= 5; biallelic locus; random mating.
  alternatives_when_assumptions_fail: Fisher's exact test for small counts; multiple
    testing correction for many markers.
  python_library_and_function: scipy.stats.chisquare (df=1)
  outputs: Observed vs expected counts, allele frequencies, chi2/p, verdict.
  common_mistakes: Concluding equilibrium from a non-significant small-sample test;
    ignoring multiple testing across markers.
  priority: P2
  pack:
  - life-science
  - agri-animal
  - bioinformatics
  sources:
  - https://en.wikipedia.org/wiki/Hardy%E2%80%93Weinberg_principle
