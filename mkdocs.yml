site_name: AUPHORIA
site_description: >-
  AUPHORIA — beginner-friendly, offline data analysis for university students
  who cannot code. Runs on your computer or in Google Colab, with no accounts
  and no uploads.
site_url: https://github.com/mysteriousammw/auphoria
repo_url: https://github.com/mysteriousammw/auphoria
edit_uri: ""

# Docs live in docs_site/ (authored pages + generated analyses/) to keep the
# root docs/ folder free for the project's own development documentation.
docs_dir: docs_site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - include-markdown

# The static link checker can't see anchors generated by the tabbed extension
# (the platform tabs in quickstart.md). The anchors are real and render
# correctly; scoping the warning to that file keeps the build log clean.
validation:
  links:
    unrecognized_links: info
    anchors: info
    absolute_links: warn
  nav:
    omitted_files: warn
    not_found: warn

copyright: >
  AUPHORIA is free, open-source software for teaching and research guidance.
  It does not certify your science — see the responsible-use page.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mysteriousammw/auphoria

nav:
  - Home: index.md
  - Quickstart (15 min): quickstart.md
  - Which analysis?: choose.md
  - Analyses:
      - analyses/index.md
      - analyses/summary.md
      - analyses/describe.md
      - analyses/ttest.md
      - analyses/ttest-paired.md
      - analyses/mann-whitney.md
      - analyses/kruskal-wallis.md
      - analyses/correlation.md
      - analyses/spearman-correlation.md
      - analyses/chi-square.md
      - analyses/anova-oneway.md
      - analyses/regression-linear.md
      - analyses/regression-multiple.md
      - analyses/logistic-regression.md
      - analyses/odds-and-risk.md
      - analyses/cronbach-alpha.md
      - analyses/ancova.md
      - analyses/mixed-effects.md
      - analyses/pca.md
      - analyses/factor-analysis.md
      - analyses/clustering-kmeans.md
      - analyses/kaplan-meier.md
      - analyses/cox-regression.md
      - analyses/diagnostic-test.md
      - analyses/ml-classification-eval.md
      - analyses/ml-regression-eval.md
  - Gallery: gallery.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Known issues: known-issues.md
  - Responsible use: responsible-use.md
  - Discipline packs: DISCIPLINE_PACKS.md
  - Validation: validation.md
  - Decision guide: research/decision-guide.md