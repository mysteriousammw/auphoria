# AUPHORIA reference fixtures
#
# For every shipped analysis: the independent reference it is cross-checked
# against and the exact expected values. These are the values the analysis's
# own tests assert (see src/auphoria/analyses/<id>/tests/). They come from
# hand-computed textbook examples and/or the reference implementation
# (SciPy, statsmodels, scikit-learn — the permissive, independently-written
# libraries the project uses). R is intentionally NOT a runtime dependency,
# so independent references are published/worked examples + second-library
# reproduction rather than an R call.
#
# Structure per analysis:
#   source:       where the reference values come from
#   how_produced: how they were computed / documented
#   values:       {metric_name: {value, tolerance, unit?}} — the ground truth
#
# Tolerances are absolute unless noted.

version: 1

analyses:

  ttest:
    source: "Hand-computed textbook example (independent-samples t); cross-checked vs scipy.stats.ttest_ind"
    how_produced: "Two groups with hand-chosen means; t, df, p computed by hand in the test docstring and matched to scipy."
    values:
      t: {value: 5.1962, tolerance: 0.01}
      df: {value: 6, tolerance: 0.0}
      mean_A: {value: 4.0, tolerance: 1e-4}
      mean_B: {value: 10.0, tolerance: 1e-4}

  ttest-paired:
    source: "Hand-computed paired example; cross-checked vs scipy.stats.ttest_rel"
    how_produced: "Paired differences built in the test; t, d_z and 95% CI computed by hand and matched to scipy."
    values:
      t: {value: 7.4833, tolerance: 1e-4}
      d_z: {value: 3.3466, tolerance: 0.01}
      lower_ci: {value: 2.8 - 2.7764 * 0.37417, tolerance: 1e-3}

  correlation:
    source: "Hand-computed Pearson r on x=[1..5]; cross-checked vs scipy.stats.pearsonr"
    how_produced: "y chosen linear in x so r → 1; a second set gives a known r; matched to scipy."
    values:
      r_perfect: {value: 1.0, tolerance: 1e-6}

  spearman-correlation:
    source: "Hand-computed rho = 0.5 (rank-d^2 sum = 10) for x=[1..5], y=[3,1,4,2,5]; cross-checked vs scipy.stats.spearmanr"
    how_produced: "Rank correlation computed by hand from ranked differences, matched to scipy (1e-6)."
    values:
      rho: {value: 0.5, tolerance: 1e-6}

  chi-square:
    source: "2x2 table [[30,10],[10,30]]; cross-checked vs scipy.stats.chi2_contingency"
    how_produced: "chi2, df, p and Cramer's V computed by hand and matched to scipy (1e-6)."
    values:
      chi2: {value: 18.05, tolerance: 1e-3}
      df: {value: 1, tolerance: 0.0}
      cramers_v: {value: 0.475, tolerance: 1e-3}

  anova-oneway:
    source: "Three groups, means 4/10/16; cross-checked vs scipy.stats.f_oneway + studentized_range"
    how_produced: "SS_between, SS_within, F, eta-squared and Tukey q computed by hand and matched to scipy (1e-6)."
    values:
      ss_between: {value: 288, tolerance: 1e-6}
      ss_within: {value: 24, tolerance: 1e-6}
      F: {value: 54.0, tolerance: 1e-6}
      eta_squared: {value: 0.9231, tolerance: 1e-4}

  mann-whitney:
    source: "A=[1,2,3], B=[4,5,6,7]; cross-checked vs scipy.stats.mannwhitneyu"
    how_produced: "Rank-sum U and exact two-sided p = 2/35 = 0.05714 computed by hand and matched to scipy."
    values:
      U: {value: 0.0, tolerance: 1e-6}
      p: {value: 0.05714, tolerance: 1e-4}
      rank_biserial_r: {value: 1.0, tolerance: 1e-4}

  summary:
    source: "Hand-computed descriptive stats on small numeric columns"
    how_produced: "Mean, median, SD, quartiles and IQR computed by hand in the test and asserted per column."
    values: {}

  describe:
    source: "Hand-built mixed-type frame with deliberately inserted problems"
    how_produced: "Missing values, duplicates, a constant column, an outlier and a negative age are each caught, reported, and neither changed nor removed (asserted per flag)."
    values: {}

  ancova:
    source: "Tiny orthogonal 2-group dataset; cross-checked vs statsmodels.formula.api.ols"
    how_produced: "Covariate slope 3/4 = 0.75, group offset 10/3, group F = 120 on df(1,3), partial eta-squared 40/41 — matched to statsmodels OLS."
    values:
      covariate_slope: {value: 0.75, tolerance: 1e-3}
      group_F: {value: 120.0, tolerance: 1e-2}
      partial_eta_sq: {value: 0.97561, tolerance: 1e-4}

  mixed-effects:
    source: "Synthetic nested data; cross-checked vs statsmodels MixedLM (REML)"
    how_produced: "Fixed-effect coefficients, variance components and ICC computed and matched to statsmodels MixedLM within 1e-4."
    values:
      group_B_offset: {value: 3.0, tolerance: 1e-4}

  pca:
    source: "Perfect-correlation 2-column data; cross-checked vs sklearn.decomposition.PCA"
    how_produced: "Hand-computed: PC1 explains ~100% variance with loading 1/sqrt(2) per column; matched to sklearn."
    values:
      pc1_loading: {value: 0.7071068, tolerance: 1e-4}
      pc1_variance_ratio: {value: 1.0, tolerance: 1e-4}

  factor-analysis:
    source: "Synthetic two-factor data; cross-checked vs sklearn.decomposition.FactorAnalysis + textbook Bartlett/KMO"
    how_produced: "Bartlett chi2 = 3498.26 (df=15), KMO = 0.784; loadings matched to sklearn (1e-3, sign-aligned); two-factor structure recovered."
    values:
      bartlett_chi2: {value: 3498.26, tolerance: 0.05}
      kmo: {value: 0.784, tolerance: 0.01}

  clustering-kmeans:
    source: "Three well-separated blobs; cross-checked vs sklearn.cluster.KMeans + silhouette_score"
    how_produced: "Cluster labels (0 mismatches after relabel), centres and silhouette 0.9317 matched to sklearn (1e-4)."
    values:
      silhouette: {value: 0.9317, tolerance: 1e-4}
      label_mismatches: {value: 0, tolerance: 0.0}

  kaplan-meier:
    source: "Hand-computed survival curve for times [2,3,5,6], events [1,1,0,1]; cross-checked vs statsmodels SurvfuncRight + hand log-rank"
    how_produced: "S(t) = [0.75, 0.50, 0.00] at [2,3,6]; log-rank chi2 = 147/51 = 2.882, p = 0.08956 — matched to statsmodels + scipy."
    values:
      survival_2: {value: 0.75, tolerance: 1e-4}
      survival_3: {value: 0.50, tolerance: 1e-4}
      logrank_chi2: {value: 2.8824, tolerance: 1e-3}
      logrank_p: {value: 0.08956, tolerance: 1e-3}

  cox-regression:
    source: "Synthetic survival data; cross-checked vs statsmodels.duration.hazard_regression.PHReg"
    how_produced: "Hazard ratios (exp(coef)), 95% CI and p matched to statsmodels PHReg within 1e-3 (asserted in test)."
    values: {}

  diagnostic-test:
    source: "Tiny 10-row set (scores 1-10 vs binary reference); cross-checked vs sklearn.metrics"
    how_produced: "Youden threshold, sensitivity/specificity = 1.0, AUC = 1.0, confusion matrix 5/0/0/5 — matched to sklearn (1e-4)."
    values:
      sensitivity: {value: 1.0, tolerance: 1e-4}
      specificity: {value: 1.0, tolerance: 1e-4}
      auc: {value: 1.0, tolerance: 1e-4}

  ml-classification-eval:
    source: "Synthetic features; cross-checked vs scikit-learn (LogisticRegression, same split/seed)"
    how_produced: "Test accuracy, precision/recall/F1, ROC-AUC and confusion matrix matched to sklearn (1e-4) with random_state=1 (asserted in test)."
    values: {}

  ml-regression-eval:
    source: "Synthetic features; cross-checked vs scikit-learn LinearRegression (same split/seed)"
    how_produced: "RMSE 0.45065, MAE 0.38224, R2 0.96328 matched to sklearn (1e-3/1e-4)."
    values:
      rmse: {value: 0.45065, tolerance: 1e-3}
      mae: {value: 0.38224, tolerance: 1e-4}
      r2: {value: 0.96328, tolerance: 1e-4}

  kruskal-wallis:
    source: "Hand-computed H on groups A=[1,2,3], B=[4,5,6], C=[7,8,9]; cross-checked vs scipy.stats.kruskal"
    how_produced: "Rank sums 6,15,24; N=9, n_j=3. H = 12/(9*10)*279 - 30 = 37.2 - 30 = 7.2, df = 2."
    values:
      H: {value: 7.2, tolerance: 1e-4}
      df: {value: 2, tolerance: 0.0}

  regression-linear:
    source: "Hand-computed on x=[1..5], y=[2,4,5,4,5]; cross-checked vs scipy.stats.linregress"
    how_produced: "Sxx=10, Sxy=6; slope=0.6, intercept=2.2, r=6/sqrt(60)=0.7746, R2=0.6."
    values:
      slope: {value: 0.6, tolerance: 1e-6}
      intercept: {value: 2.2, tolerance: 1e-6}
      r2: {value: 0.6, tolerance: 1e-4}

  regression-multiple:
    source: "Synthetic y = 1.0 + 2.0*x1 - 1.0*x2 + e; cross-checked vs statsmodels OLS"
    how_produced: "Fitted coefficients and R2 matched to an independent statsmodels.api.OLS fit within 1e-6."
    values:
      beta_intercept: {value: 1.0, tolerance: 0.5}
      beta_x1: {value: 2.0, tolerance: 0.5}
      beta_x2: {value: -1.0, tolerance: 0.5}

  logistic-regression:
    source: "Synthetic data from logit(p) = -1 + 1.5*x1 - 0.8*x2 (+ noise), labels by threshold; cross-checked vs statsmodels Logit"
    how_produced: "Recovered coefficients and LR p matched to an independent statsmodels.api.Logit fit within 1e-5."
    values: {}

  odds-and-risk:
    source: "Hand-computed 2x2 a=40,b=20;c=15,d=45; cross-checked vs scipy chi2_contingency + fisher_exact"
    how_produced: "OR = (40*45)/(20*15) = 6.0; RR = (40/60)/(15/60) = 2.6667."
    values:
      OR: {value: 6.0, tolerance: 1e-4}
      RR: {value: 2.6667, tolerance: 1e-4}

  cronbach-alpha:
    source: "Hand-computed on 3 perfectly-correlated items x1=[1..5], x2=2x1+1, x3=2*[1..5]; cross-checked by hand"
    how_produced: "k=3, sum(item var)=18, total var=50; alpha=(3/2)*(1-18/50)=0.96; standardised alpha=1.0."
    values:
      alpha: {value: 0.96, tolerance: 1e-3}
      standardised_alpha: {value: 1.0, tolerance: 1e-4}

  anova-repeated:
    source: "Deterministic 6-subject x 3-time dataset; cross-checked vs statsmodels AnovaRM"
    how_produced: "F(2,10) = 21.7857, partial eta-squared = 976/1200 = 0.8133 hand-computed; Mauchly W = 0.3817, p = 0.1275."
    values:
      F: {value: 21.7857, tolerance: 1e-3}
      partial_eta2: {value: 0.8133, tolerance: 1e-3}
      mauchly_W: {value: 0.3817, tolerance: 1e-3}

  friedman:
    source: "Hand-computed classic 3-times x 6-subjects example; cross-checked vs scipy.stats.friedmanchisquare"
    how_produced: "chi2 = 12.0, df = 2 for ranks 1,2,3 per subject (168 - 72 = 12); Bonferroni posthoc = 3 x raw p capped at 1."
    values:
      chi2: {value: 12.0, tolerance: 1e-3}
      df: {value: 2, tolerance: 0.0}

  bland-altman:
    source: "Hand-computed pairs (1,1.2)...(5,4.9); cross-checked by hand routine"
    how_produced: "bias = -0.02, SD = 0.13038, lower LoA = -0.2756, upper LoA = 0.2356 (bias +/- 1.96*SD)."
    values:
      bias: {value: -0.02, tolerance: 1e-4}
      sd: {value: 0.13038, tolerance: 1e-4}
      loa_lower: {value: -0.2756, tolerance: 1e-3}
      loa_upper: {value: 0.2356, tolerance: 1e-3}

  panel-regression:
    source: "Deterministic panel y_it = 2*x_it + entity effect + e; cross-checked vs LSDV fixed-effects OLS"
    how_produced: "Within-estimator (group-demeaned) recovers beta_x ~ 2.0, R2-within ~ 0.9513, matching least-squares dummy-variable reference to 1e-5."
    values:
      beta_x: {value: 2.0, tolerance: 1e-2}
      r2_within: {value: 0.9513, tolerance: 1e-2}

  time-series:
    source: "Deterministic series 0.2*t + 3*sin(2*pi*t/12) + noise(seed 42); cross-checked vs scipy.stats.linregress"
    how_produced: "Trend slope ~0.2 (fitted), seasonal amplitude ~6.0 (max-min of a 3*sin component)."
    values:
      trend_slope: {value: 0.2, tolerance: 0.02}
      seasonal_amplitude: {value: 6.0, tolerance: 0.3}

  differential-expression:
    source: "Deterministic synthetic counts (8 samples, 4 treated/4 control, 100 genes with known DE set); cross-checked vs directly-recomputed PyDESeq2"
    how_produced: "Known over/under-expressed genes have padj < 0.05 (>=80% of each set) and per-gene padj/log2FC match a fresh PyDESeq2 fit within 1e-3."
    values:
      n_significant: {value: 16, tolerance: 0.0}

  sem:
    source: "Synthetic four-item one-factor data (known loadings); CFI/TLI/RMSEA/SRMR via semopy calc_stats"
    how_produced: "One-factor model fits well: CFI > 0.95, RMSEA < 0.06; standardised loading present per item."
    values:
      CFI: {value: 0.99, tolerance: 0.05}
      RMSEA: {value: 0.03, tolerance: 0.03}
  experimental-design:
    source: "CRD/RCBD/Latin/factorial textbook fixtures in tests/test_experimental_design.py (anova-oneway-style SS identities)"
    how_produced: "Hand-computed SS/F for each layout; cross-checked vs scipy f_oneway, studentized_range, levene, shapiro"
    values:
      CRD_F: {value: 54.0, tolerance: 0.01}
      RCBD_treatment_F: {value: 216.0, tolerance: 0.01}
      Latin_treatment_F: {value: 36.0, tolerance: 0.01}
      Factorial_interaction_F: {value: 6.0, tolerance: 0.01}

  sequence-composition:
    source: "Hand-computed small sequences in tests/test_sequence_composition.py"
    how_produced: "ATGCGC -> length 6, GC% = 100*4/6 = 66.67, counts A1 T1 G2 C2; AUGC -> RNA, GC 50%"
    values:
      GC_percent: {value: 66.67, tolerance: 0.01}
      length: {value: 6, tolerance: 0}

  sequence-translation:
    source: "Hand-checked standard-code translations in tests/test_sequence_translation.py"
    how_produced: "ATGGCT -> 'MA'; ATG GCT TAA -> ORF start 1 end 9 peptide 'MA*'; GGGATGGCTTAA -> ORF at base 4"
    values:
      orf_peptide: {value: "MA*", tolerance: 0}
      orf_length_aa: {value: 3, tolerance: 0}

  sequence-alignment:
    source: "Hand-traced Needleman-Wunsch / Smith-Waterman in tests/test_sequence_alignment.py"
    how_produced: "ACGT vs ACGT global score 8 (4 matches x 2); ACGT vs ACGA -> 5, identity 75%; local XXACGTYY vs WWACGTZZ -> best region ACGT score 8"
    values:
      global_score: {value: 8.0, tolerance: 0.01}
      local_score: {value: 8.0, tolerance: 0.01}
      mismatch_identity_percent: {value: 75.0, tolerance: 0.01}

  hardy-weinberg:
    source: "Classic HWE fixture in tests/test_hardy_weinberg.py"
    how_produced: "AA=30,Aa=50,aa=20 -> p=0.55, E=30.25/49.5/20.25, chi2=0.0102, p=0.919; AA=40,Aa=20,aa=40 -> E=25/50/25, chi2=36, p=2e-9"
    values:
      equilibrium_chi2: {value: 0.0102, tolerance: 0.001}
      deviation_chi2: {value: 36.0, tolerance: 0.01}
